# 反向代理示例（P5 §6）。**可选**：默认那档只有 app，一个容器一个端口就够了。
#
# 上 nginx 的理由通常只有两个：要 TLS、要域名。而一旦中间多了这一层，
# 下面这三段配置就都是必需的 —— 少任何一段，故障的表现都不是「nginx 报错」，
# 而是前端某个功能安静地不动：
#
#   1. SSE（/api/... 里的两条流）：必须关缓冲。不关的话事件其实一直在发，
#      只是被 nginx 攒在缓冲区里，用户看到一条永远不动的进度条。
#   2. WebSocket（/ws/...）：必须转发 Upgrade 头 + 放大读超时。
#      不转发的话握手之后连接立刻被当成普通 HTTP 关掉。
#   3. 一次性下载链接（/api/exports/<id>/download）：它靠 URL 里的
#      **一次性票据**换取文件，所以这一条路径既不能被缓存，也不该被记进
#      访问日志的请求行（日志里的票对拿到日志的人就是那把钥匙）。

upstream eduagentx_app {
    server app:5000;
    keepalive 32;
}

# HTTP：健康检查直接放行，其余全部跳 HTTPS。
server {
    listen 80;
    server_name _;

    # 容器自己的健康检查（compose 里那条）走的是 app 直连，
    # 这里留一条是为了负载均衡 / 外部探活。
    location = /api/health {
        proxy_pass http://eduagentx_app;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;   # 换成你的域名

    # --- 证书 ---
    # compose 把 ./docker/certs 挂到 /etc/nginx/certs。
    # 正式的证书用 certbot 签；本地自签也能跑通
    # （浏览器会拦一次，继续访问即可）。
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 客户端上传的材料最大 50MB（MATERIAL_MAX_BYTES），留一点余量
    client_max_body_size 64m;

    # --- 1. SSE：生成进度流 ---
    # `proxy_buffering off` 之外还要 `proxy_read_timeout` 足够长：
    # 默认 60s 一到，nginx 会主动掐掉这条「太久没数据」的连接。
    # 应用侧的心跳是 15s（SSE_HEARTBEAT），正常情况下不会触发，
    # 但生成中间卡在一次慢调用上时，这条设置才决定用户会不会突然断流。
    location ~ ^/api/courses/generate/[^/]+/stream$ {
        proxy_pass http://eduagentx_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;   # 对 SSE 压缩会让「攒够一块再发」重新出现
    }

    # --- 2. WebSocket：实时语音与课堂推送 ---
    # `Map` 不是这里能写的，所以直接写死 upgrade 头：这两条专用路径上
    # 只有 WS 请求，不存在普通 HTTP 请求被误升级的问题。
    location /ws/ {
        proxy_pass http://eduagentx_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 一堂课最长也就一两个小时；到点断开让客户端重连，
        # 比留一条永远不断的僵尸连接好。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- 3. 一次性下载 ---
    location ~ ^/api/exports/[^/]+/download$ {
        proxy_pass http://eduagentx_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;   # 产物可能几十 MB，边下边发
        proxy_read_timeout 300s;
        # 票据在查询串里，不进访问日志
        access_log off;
    }

    # 其余 API 与页面
    location / {
        proxy_pass http://eduagentx_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端据此填审计日志里的 IP —— 前提是那边开了 AUDIT_TRUST_PROXY
        # （services/audit.py 第 2 条）。这里转发、那边开关，两件要一起做。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # index.html 由后端明确给了 no-cache，这里不覆盖它；
        # /assets/ 下面的文件名带内容哈希，后端给了 immutable 长缓存。
        proxy_buffering on;
    }
}
