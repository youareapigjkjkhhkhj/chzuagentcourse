# scripts/ 下是运维与验收脚本，不是服务端代码 —— 这里放行的几条
# 规则，正是「本地脚本本来就该这么写」的那几条：
#   S603/S607  按名字调用本机工具（flask / npm），这就是脚本的工作
#   S310       urlopen 打的是本机 localhost 上我们自己起的服务
#   PLR0912/3  验收脚本一个函数里串好几个子项，分支多是常态
#   RET503     「不通过就 return，通过就往下走」的写法，末尾不补空 return
#
# 安全相关的检查没关：scripts 里同样不许出现密钥、不允许拼接不可信路径。
line-length = 100
target-version = "py310"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "RET", "PL", "S", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "S603",
    "S607",
    "S310",
    "PLR0912",
    "PLR0913",
    # 验收脚本里 200 / 1.2 / 16 这些数字就是「验收标准本身」
    #（语速 1.2、页数 16），抽成常量反而看不出在验什么
    "PLR2004",
    "RET503",
]
